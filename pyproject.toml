[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellpilot-ai"
version = "0.1.0"
description = "A reproducible single-cell RNA-seq analysis, annotation, and interpretation workflow."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata==0.13.4",
  "celltypist==1.7.1",
  "certifi==2026.7.22",
  "matplotlib==3.11.2",
  "numpy==2.5.4",
  "pandas==3.0.6",
  "pydantic==2.14.1",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "scanpy[leiden]==1.12.4",
  "scikit-learn==1.7.2",
  "seaborn==0.13.2",
  "scipy==1.18.1",
  "streamlit==1.65.0",
]

[project.optional-dependencies]
ai = [
  "openai==2.54.0",
]
test = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[project.scripts]
cellpilot = "cellpilot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cellpilot = ["resources/*.yaml"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
markers = [
  "unit: fast tests that do not access the network or large public datasets",
  "integration: tests spanning multiple CellPilot components",
  "network: tests that download public datasets, models, or references",
  "slow: tests that run full scientific workflows or benchmarks",
]

[tool.coverage.run]
branch = true
source = ["cellpilot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
